<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Vasco</title>
</head>
<body class="homey-widget-full">
  <h1 class="homey-title">Sign in to Vasco</h1>
  <p class="homey-subtitle">
    Before signing in, connect an online Vasco/Kermi gateway and make sure the
    ventilation unit is visible and controllable in the Vasco Climate Control app.
    Enter credentials for the same Vasco cloud account.
  </p>

  <form id="login-form" class="homey-form">
    <div class="homey-form-group">
      <label class="homey-form-label" for="email">Email</label>
      <input
        id="email"
        class="homey-form-input"
        type="email"
        autocomplete="username"
        required
      >
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="password">Password</label>
      <input
        id="password"
        class="homey-form-input"
        type="password"
        autocomplete="current-password"
        required
      >
    </div>
    <p id="error" class="homey-form-error" role="alert"></p>
    <button id="submit" class="homey-button-primary-full" type="submit">Sign in</button>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const submit = document.getElementById('submit');
    const errorMessage = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      errorMessage.textContent = '';

      try {
        await Homey.emit('login', {
          email: email.value,
          password: password.value,
        });
        await Homey.showView('list_devices');
      } catch (error) {
        errorMessage.textContent = 'Could not sign in. Check your credentials and try again.';
      } finally {
        submit.disabled = false;
      }
    });

    Homey.ready();
  </script>
</body>
</html>
